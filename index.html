<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ອັນພາແຕ້</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#0b0b0b;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:#111;
    border-bottom:1px solid #222;
}

.logo{
    color:#ff2b2b;
    font-size:32px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
}

.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.8)),
    url("https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1200&q=80");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:64px;
    color:#ff2b2b;
}

.hero p{
    margin:20px 0;
    color:#ddd;
    font-size:20px;
}

.btn{
    display:inline-block;
    padding:15px 35px;
    background:#ff2b2b;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.products{
    padding:60px 30px;
    text-align:center;
}

.products h2{
    color:#ff2b2b;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#181818;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.card h3{
    padding:15px;
}

.price{
    color:#ff5555;
    font-size:22px;
    margin-bottom:15px;
}

footer{
    background:#111;
    text-align:center;
    padding:25px;
    color:#888;
}
</style>
</head>

<body>

<header>
<div class="logo">ອັນພາແຕ້</div>

<nav>
<a href="#">หน้าแรก</a>
<a href="#">สินค้า</a>
<a href="#">ติดต่อ</a>
</nav>
</header>

<section class="hero">
<div>
<h1>ອັນພາແຕ້</h1>
<p>ร้านเสื้อผ้าสตรีทสไตล์ลาว</p>

<a class="btn" href="#products">ເລືອກຊື້ສິນຄ້າ</a>
</div>
</section>

<section class="products" id="products">
<h2>สินค้าแนะนำ</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=600&q=80">
<h3>Hoodie Black</h3>
<div class="price">350,000 ₭</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=600&q=80">
<h3>Street T-Shirt</h3>
<div class="price">180,000 ₭</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80">
<h3>Oversize Hoodie</h3>
<div class="price">390,000 ₭</div>
</div>

</div>
</section>

<footer>
© 2026 ອັນພາແຕ້ | Streetwear Laos
</footer>

</body>
</html>
