<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บอทมีมเตือนเล่นเกมดิสคอร์ด (Custom รายวัน)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-2xl w-full max-w-xl">
        <h1 class="text-2xl font-bold text-center text-red-500 mb-2">🎮 บอทเตือนเล่นเกม (ตั้งค่าเองได้ + แจ้งเตือนทุกวัน)</h1>
        <p class="text-gray-400 text-center text-sm mb-6">ตั้งเวลา พิมพ์ข้อความ และใส่ลิงก์มีม/วิดีโอเองได้ บันทึกค่าให้อัตโนมัติ</p>

        <!-- ฟอร์มตั้งค่าหลัก -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Discord Webhook URL:</label>
                <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">เวลาแจ้งเตือนทุกวัน:</label>
                    <input type="time" id="alertTime" value="20:00" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">สถานะระบบ:</label>
                    <div id="statusBadge" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-center text-yellow-400 font-semibold flex items-center justify-center">
                        ⏸️ ปิดทำงาน
                    </div>
                </div>
            </div>

            <!-- ส่วนกำหนดข้อความและมีมเอง -->
            <div class="border-t border-gray-700 pt-4 space-y-3">
                <h3 class="text-sm font-semibold text-gray-300">💬 ข้อความกวน ๆ (ใส่หลายบรรทัด บอทจะสุ่มเลือก 1 อันทุกวัน):</h3>
                <textarea id="customMessages" rows="3" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500 font-mono"
                    placeholder="เฮ้ย! ถึงเวลาเล่นเกมแล้วไอ้เวร ลุกขึ้นมาแจกได้แล้ว!&#10;พวกเวรตื่น! เปิดคอมได้แล้ว โดนตบยับแน่"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">🎬 ลิงก์รูปภาพ หรือ วิดีโอสั้น / GIF (ใส่หลายบรรทัด บอทจะสุ่มเลือก 1 อัน):</label>
                <textarea id="customMedia" rows="2" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500 font-mono"
                    placeholder="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif&#10;https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4"></textarea>
            </div>

            <!-- ปุ่มควบคุม -->
            <div class="flex gap-3 pt-2">
                <button onclick="toggleBot()" id="toggleBtn" class="flex-1 bg-green-600 hover:bg-green-500 font-bold py-3 rounded-lg transition">
                    ▶️ เปิดระบบแจ้งเตือนทุกวัน
                </button>
                <button onclick="sendTestMessage(true)" class="bg-blue-600 hover:bg-blue-500 font-bold px-4 py-3 rounded-lg transition">
                    🚀 เทสส่งทันที
                </button>
            </div>
        </div>

        <!-- หน้าจอ Log แสดงผล -->
        <div class="mt-6">
            <label class="block text-sm font-medium text-gray-300 mb-1">Log การทำงาน:</label>
            <div id="logBox" class="bg-gray-900 border border-gray-700 rounded-lg p-3 h-32 overflow-y-auto text-xs text-green-400 font-mono">
                [System] โหลดค่าที่บันทึกไว้เรียบร้อย...
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let timerInterval = null;
        let lastTriggeredDate = "";

        // ค่าเริ่มต้นถ้ายังไม่มีในเครื่อง
        const defaultMessages = [
            "เฮ้ย! ถึงเวลาเล่นเกมแล้วไอ้เวร ลุกขึ้นมาแจกได้แล้ว!",
            "พวกเวรตื่น! เปิดคอมได้แล้ว โดนตบยับแน่ถ้าไม่มาตอนนี้",
            "ได้เวลาเข้าดิสมาเป็นภาระให้กูอีกแล้วไอ้สาด!"
        ];

        const defaultMedia = [
            "https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif",
            "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4"
        ];

        // โหลดข้อมูลที่บันทึกไว้ใน Browser (LocalStorage) เมื่อเปิดเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            const savedWebhook = localStorage.getItem('discord_webhook');
            const savedTime = localStorage.getItem('discord_time');
            const savedMsg = localStorage.getItem('discord_messages');
            const savedMedia = localStorage.getItem('discord_media');

            if (savedWebhook) document.getElementById('webhookUrl').value = savedWebhook;
            if (savedTime) document.getElementById('alertTime').value = savedTime;
            if (savedMsg) {
                document.getElementById('customMessages').value = savedMsg;
            } else {
                document.getElementById('customMessages').value = defaultMessages.join('\n');
            }
            if (savedMedia) {
                document.getElementById('customMedia').value = savedMedia;
            } else {
                document.getElementById('customMedia').value = defaultMedia.join('\n');
            }
        });

        // ฟังก์ชันบันทึกข้อมูลอัตโนมัติเมื่อมีการเปลี่ยนแปลง
        function saveSettings() {
            localStorage.setItem('discord_webhook', document.getElementById('webhookUrl').value.trim());
            localStorage.setItem('discord_time', document.getElementById('alertTime').value);
            localStorage.setItem('discord_messages', document.getElementById('customMessages').value);
            localStorage.setItem('discord_media', document.getElementById('customMedia').value);
        }

        function log(text) {
            const box = document.getElementById('logBox');
            const timeStr = new Date().toLocaleTimeString();
            box.innerHTML += `[${timeStr}] ${text}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function toggleBot() {
            saveSettings(); // บันทึกค่าก่อนเปิดระบบ
            const webhook = document.getElementById('webhookUrl').value.trim();
            if (!webhook && !isRunning) {
                alert("กรุณาใส่ Discord Webhook URL ก่อนครับ!");
                return;
            }

            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            const badge = document.getElementById('statusBadge');
            const targetTime = document.getElementById('alertTime').value;

            if (isRunning) {
                btn.innerText = "⏹️ ปิดระบบ";
                btn.className = "flex-1 bg-red-600 hover:bg-red-500 font-bold py-3 rounded-lg transition";
                badge.innerText = "🟢 รอเวลาแจ้งเตือนทุกวัน";
                badge.className = "w-full bg-gray-900 border border-green-600 rounded-lg p-3 text-sm text-center text-green-400 font-semibold flex items-center justify-center";
                log(`เปิดระบบสำเร็จ! บันทึก URL เรียบร้อย จะแจ้งเตือนทุกวันเวลา ${targetTime} น. (ห้ามปิดแท็บเว็บนี้)`);
                
                // เช็คเวลาทุกๆ 10 วินาที
                timerInterval = setInterval(checkDailyTimer, 10000);
            } else {
                btn.innerText = "▶️ เปิดระบบแจ้งเตือนทุกวัน";
                btn.className = "flex-1 bg-green-600 hover:bg-green-500 font-bold py-3 rounded-lg transition";
                badge.innerText = "⏸️ ปิดทำงาน";
                badge.className = "w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-center text-yellow-400 font-semibold flex items-center justify-center";
                log("ปิดการทำงานระบบแจ้งเตือนรายวันแล้ว");
                clearInterval(timerInterval);
            }
        }

        async function sendTestMessage(isManual = false) {
            saveSettings();
            const webhook = document.getElementById('webhookUrl').value.trim();
            if (!webhook) {
                if (isManual) alert("กรุณาใส่ Discord Webhook URL ก่อนครับ!");
                return;
            }

            // ดึงข้อความจาก Textarea มาแยกบรรทัด
            const rawMsgText = document.getElementById('customMessages').value.trim();
            const messages = rawMsgText ? rawMsgText.split('\n').filter(m => m.trim() !== '') : defaultMessages;

            const rawMediaText = document.getElementById('customMedia').value.trim();
            const mediaList = rawMediaText ? rawMediaText.split('\n').filter(m => m.trim() !== '') : defaultMedia;

            // สุ่มข้อความและมีม/วิดีโอ
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            const randomMedia = mediaList[Math.floor(Math.random() * mediaList.length)];

            const payload = {
                content: `@everyone ${randomMsg}\n\n🎬 ${randomMedia}`
            };

            if (isManual) log("กำลังส่งข้อความเทสเข้า Discord...");

            try {
                const response = await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    log("✅ ส่งข้อความและมีม/วิดีโอเข้า Discord สำเร็จ!");
                } else {
                    log("❌ ส่งไม่สำเร็จ เช็ค Webhook URL อีกครั้ง");
                }
            } catch (err) {
                log("⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ (CORS หรือ URL ผิด)");
            }
        }

        function checkDailyTimer() {
            if (!isRunning) return;

            const now = new Date();
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHours}:${currentMinutes}`;
            
            const currentDateStr = now.toDateString();
            const targetTime = document.getElementById('alertTime').value;

            if (currentTimeStr === targetTime && lastTriggeredDate !== currentDateStr) {
                lastTriggeredDate = currentDateStr;
                log(`⏰ ถึงเวลา ${targetTime} น. แล้ว! กำลังส่งมีมรายวันเข้า Discord...`);
                sendTestMessage(false);
            }
        }
    </script>
</body>
</html>
