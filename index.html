<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin ຮ້ານບໍ່ແພງແຕ່ເທ້ V5.2 - Protected</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg-main: #06060c;
  --accent-red: #ff2a2a;
  --accent-glow: rgba(255, 42, 42, 0.4);
  --panel-bg: rgba(18, 18, 26, 0.75);
  --panel-border: rgba(255, 42, 42, 0.25);
  --input-bg: rgba(10, 10, 16, 0.8);
}

body {
  margin: 0;
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(255, 0, 60, 0.15) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(120, 0, 255, 0.1) 0%, transparent 45%),
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
  background-attachment: fixed;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
}

/* ================= LOGIN SCREEN ================= */
#loginScreen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: var(--bg-main);
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
}
.login-box {
  background: var(--panel-bg);
  backdrop-filter: blur(15px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255, 42, 42, 0.2);
}
.login-box h2 {
  margin-top: 0;
  color: #fff;
  text-shadow: 0 0 10px var(--accent-red);
}
.login-box input {
  text-align: center;
  font-size: 18px;
  letter-spacing: 2px;
  margin-bottom: 15px;
}
#loginErr {
  color: #ff4444;
  font-size: 14px;
  margin-top: 10px;
  display: none;
}

/* ================= MAIN CONTENT ================= */
#mainApp {
  display: none; /* ซ่อนไว้ก่อนจนกว่าจะล็อกอินสำเร็จ */
}

.header-bar {
  background: linear-gradient(90deg, rgba(15,0,0,0.9) 0%, rgba(40,5,5,0.9) 50%, rgba(15,0,0,0.9) 100%);
  padding: 15px 25px;
  border-bottom: 2px solid var(--accent-red);
  box-shadow: 0 4px 25px rgba(255, 42, 42, 0.3);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-bar h2 {
  color: #fff;
  margin: 0;
  font-weight: 800;
  letter-spacing: 1px;
  text-shadow: 0 0 12px var(--accent-red);
  font-size: 20px;
}
.user-status {
  display: flex;
  align-items: center;
  gap: 12px;
}
