<input type="file" id="upload" accept="image/*">

<button id="aiBtn">✨ AI จัดทรงเสื้อ</button>

<img id="before" width="300">
<img id="after" width="300">

<script>
const upload = document.getElementById("upload");
const before = document.getElementById("before");
const after = document.getElementById("after");

let imageFile;

upload.onchange = (e)=>{
    imageFile = e.target.files[0];
    before.src = URL.createObjectURL(imageFile);
};

aiBtn.onclick = async ()=>{

    if(!imageFile){
        alert("เลือกรูปก่อน");
        return;
    }

    aiBtn.innerText = "AI กำลังจัดทรง...";

    const form = new FormData();
    form.append("image", imageFile);

    const response = await fetch("/api/ai-style", {
        method:"POST",
        body:form
    });

    const result = await response.blob();

    after.src = URL.createObjectURL(result);

    aiBtn.innerText = "✅ เสร็จแล้ว";
};
</script>
