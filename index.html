<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ອັນພາແຕ້ | Streetwear Laos</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0d0d0d;color:white}
header{
background:#111;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff2b2b;
position:sticky;
top:0;
}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
padding:25px;
}
.card{
background:#171717;
border-radius:18px;
overflow:hidden;
border:1px solid #333;
}
.card img{
width:100%;
aspect-ratio:4/5;
object-fit:cover;
display:block;
}
.info{padding:15px}
.price{
color:#ff4b4b;
font-size:24px;
font-weight:bold;
margin:8px 0;
}
select,input{
width:100%;
padding:10px;
margin-top:8px;
background:#111;
color:white;
border:1px solid #444;
border-radius:8px;
}
.buy{
margin-top:12px;
background:#ff2b2b;
padding:12px;
text-align:center;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}
.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#ff2b2b;
padding:15px 18px;
border-radius:50px;
font-weight:bold;
cursor:pointer;
}
.cart{
display:none;
position:fixed;
top:70px;
right:20px;
width:330px;
background:#111;
border-radius:15px;
padding:18px;
max-height:450px;
overflow:auto;
border:1px solid #444;
}
.cart h3{color:#ff2b2b;margin-bottom:10px}
.item{
border-bottom:1px solid #333;
padding:10px 0;
}
.checkout{
background:#ff2b2b;
padding:12px;
text-align:center;
border-radius:10px;
margin-top:15px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>
<body>

<header>ອັນພາແຕ້ | Streetwear Laos</header>

<div class="products" id="shop"></div>

<div class="cart-btn" onclick="toggleCart()">
🛒 <span id="count">0</span>
</div>

<div class="cart" id="cartBox">
<h3>ตะกร้าสินค้า</h3>

<div id="cartItems"></div>

<h2 style="margin-top:10px">รวม: <span id="total">0</span> ₭</h2>

<div class="checkout" onclick="sendMessengerOrder()">
สั่งซื้อผ่าน Messenger
</div>

</div>

<script>

// ====== ใส่ USERNAME เพจ Facebook ตรงนี้ ======
const PAGE_USERNAME = "anphatelaos";

// ====== สินค้า ======
const products=[
{
name:"Black Hoodie",
price:350000,
image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80",
sizes:["S","M","L","XL"],
colors:["ดำ","ขาว","แดง"]
},
{
name:"Oversize T-Shirt",
price:180000,
image:"https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=900&q=80",
sizes:["S","M","L","XL"],
colors:["ดำ","ขาว","เทา"]
},
{
name:"Street Jacket",
price:420000,
image:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80",
sizes:["M","L","XL"],
colors:["ดำ","เขียว","น้ำตาล"]
}
];

// ====== แสดงสินค้า ======
const shop=document.getElementById("shop");
let cart=[];

function renderProducts(){

shop.innerHTML="";

products.forEach((p,i)=>{

shop.innerHTML+=`
<div class="card">

<img src="${p.image}">

<div class="info">

<h3>${p.name}</h3>

<div class="price">${p.price.toLocaleString()} ₭</div>

<select id="size${i}">
${p.sizes.map(s=>`<option>${s}</option>`).join("")}
</select>

<select id="color${i}">
${p.colors.map(c=>`<option>${c}</option>`).join("")}
</select>

<input type="number" id="qty${i}" value="1" min="1">

<div class="buy" onclick="addCart(${i})">
เพิ่มลงตะกร้า
</div>

</div>

</div>
`;

});

}

renderProducts();

// ====== เพิ่มตะกร้า ======
function addCart(i){

cart.push({
name:products[i].name,
price:products[i].price,
size:document.getElementById(`size${i}`).value,
color:document.getElementById(`color${i}`).value,
qty:Number(document.getElementById(`qty${i}`).value)
});

updateCart();

alert("เพิ่มลงตะกร้าแล้ว");

}

// ====== อัปเดตตะกร้า ======
function updateCart(){

document.getElementById("count").textContent=cart.length;

let total=0;

const cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";

cart.forEach((item,index)=>{

const sum=item.price*item.qty;

total+=sum;

cartItems.innerHTML+=`
<div class="item">
<b>${item.name}</b><br>
สี : ${item.color}<br>
ไซส์ : ${item.size}<br>
จำนวน : ${item.qty}<br>
ราคา : ${sum.toLocaleString()} ₭<br>
<span style="color:#ff6666;cursor:pointer"
onclick="removeItem(${index})">
ลบ
</span>
</div>
`;

});

document.getElementById("total").textContent=total.toLocaleString();

}

function removeItem(i){

cart.splice(i,1);

updateCart();

}

// ====== เปิด/ปิด ตะกร้า ======
function toggleCart(){

const box=document.getElementById("cartBox");

box.style.display=box.style.display==="block"
? "none"
: "block";

}

// ====== ส่งเข้า Messenger ======
function sendMessengerOrder(){

if(cart.length===0){
alert("ยังไม่มีสินค้าในตะกร้า");
return;
}

let total=0;

let text="🛍️ ອໍເດີສິນຄ້າ ຮ້ານ ອັນພາແຕ້\n\n";

cart.forEach((item,index)=>{

const sum=item.price*item.qty;

total+=sum;

text+=`${index+1}. ${item.name}\n`;
text+=`สี : ${item.color}\n`;
text+=`ไซส์ : ${item.size}\n`;
text+=`จำนวน : ${item.qty}\n`;
text+=`ราคา : ${sum.toLocaleString()} ₭\n\n`;

});

text+=`💰 ราคารวมทั้งหมด ${total.toLocaleString()} ₭`;

window.open(
`https://m.me/${PAGE_USERNAME}?text=${encodeURIComponent(text)}`,
"_blank"
);

}

</script>

</body>
</html>
