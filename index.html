<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ບໍ່ແພງແຕ່ເຈ້ງ - Underworld Operations</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Phetsarath:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 & html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-deep: #07080a;
            --bg-panel: #11141b;
            --bg-card: #181d28;
            --accent-gold: #d4af37;
            --accent-red: #8b0000;
            --accent-red-hover: #a30000;
            --text-main: #c0c5d0;
            --text-bright: #ffffff;
            --border-dark: #232a38;
            --discord-color: #5865F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Phetsarath', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 0, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            padding: 20px;
        }

        header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-dark);
            padding-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand i {
            font-size: 2.2rem;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .brand h1 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-bright);
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand p {
            font-size: 0.8rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Layout หลัก */
        .workspace {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }

        @media(max-width: 950px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* ການ์ดทั่วไป */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ส่วนปฏิทิน (พื้นที่ที่จะถูกแคปเจอร์เป็นรูปภาพส่ง Discord) */
        #captureArea {
            background-color: var(--bg-panel);
            border-radius: 10px;
            padding: 5px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .calendar-nav h2 {
            color: var(--text-bright);
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            color: var(--text-bright);
            width: 38px;
            height: 38px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: #1f2533;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .days-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            min-height: 85px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .calendar-day:hover {
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
            background-color: #1c222e;
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day.today {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .calendar-day.selected {
            background-color: #241d1d;
            border-color: var(--accent-red);
        }

        .day-number {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .calendar-day.today .day-number {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .task-pills-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 45px;
            overflow-y: hidden;
        }

        .task-pill {
            background: rgba(139, 0, 0, 0.3);
            border-left: 2px solid var(--accent-red);
            color: #ff9999;
            font-size: 0.7rem;
            padding: 2px 4px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* แผงควบคุมด้านขวา */
        .control-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-bright);
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 8px;
        }

        .section-title i {
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            color: var(--text-bright);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-red);
            color: var(--text-bright);
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-red-hover);
        }

        .btn-discord {
            background-color: var(--discord-color);
        }
        .btn-discord:hover {
            background-color: #4752C4;
        }

        .btn-save-webhook {
            background-color: #2b2d31;
            border: 1px solid var(--border-dark);
            color: var(--text-bright);
        }
        .btn-save-webhook:hover {
            background-color: #35383c;
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* รายการภารกิจในวันที่เลือก */
        .active-date-header {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .task-management-list {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding-right: 4px;
        }

        .task-manage-item {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .task-manage-item span {
            color: var(--text-bright);
            word-break: break-all;
            padding-right: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .btn-delete:hover {
            transform: scale(1.2);
        }

        .empty-task-notice {
            font-size: 0.8rem;
            color: #6c757d;
            text-align: center;
            padding: 15px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px dashed var(--border-dark);
        }

        /* Scrollbar แต่งให้ดูเนียนตา */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-dark);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-skull-crossbones"></i>
            <div>
                <h1>ບໍ່ແພງແຕ່ເຈ້ງ</h1>
                <p>ຂຽນລົງແລ້ວກະເຊີນໃຫ້ມືງເຮັດຕາມແນ່</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" title="รีเซ็ตมุมมองเดือนปัจจุบัน" onclick="resetToCurrentMonth()"><i class="fa-solid fa-calendar-day"></i></button>
        </div>
    </header>

    <div class="workspace">
        <!-- ฝั่งปฏิทินหลัก (ส่วนที่จะแคปเจอร์เป็นรูปภาพ) -->
        <div class="panel">
            <div id="captureArea">
                <div class="calendar-nav">
                    <button class="btn-icon" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="calendarTitle">ເດືອນ ປີ</h2>
                    <button class="btn-icon" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="weekdays-grid">
                    <div>ອາ</div><div>ຈ</div><div>ອ</div><div>ພ</div><div>ພຫ</div><div>ສຸ</div><div>ເສ</div>
                </div>
                <div class="days-matrix" id="daysMatrix">
                    <!-- แรนเดอร์ด้วย JavaScript -->
                </div>
            </div>
        </div>

        <!-- ฝั่งจัดการภารกิจ & เชื่อมต่อ Discord -->
        <div class="control-sidebar">
            <!-- ฟอร์มเพิ่มงาน -->
            <div class="panel" style="padding: 20px;">
                <div class="section-title">
                    <i class="fa-solid fa-pen-nib"></i> ຈັດການໜ້າວຽກ / ພາລະກິດ
                </div>
                <div class="active-date-header" id="activeDateLabel">📌 ກຳລັງເລືອກ: ຍັງບໍ່ໄດ້ເລືອກວັນທີ</div>
                
                <div class="form-group">
                    <label>รายละเอียดภารกิจ / งาน</label>
                    <input type="text" id="taskInput" placeholder="ເຊັ່ນ: ສົ່ງເຄື່ອງລັອດໃຫຍ່ ເວລາ 22:00 ນ.">
                </div>
                <button class="btn-primary" onclick="addNewTask()">
                    <i class="fa-solid fa-plus"></i> บันทึกภารกิจลงวันนั้น
                </button>

                <div class="task-management-list" id="taskManagementList">
                    <div class="empty-task-notice">ເລືອກວັນທີເທິງປະຕິທິນເພື່ອເບິ່ງ ຫຼື ເພີ່ມພາລະກິດ</div>
                </div>
            </div>

            <!-- ฟอร์มส่ง Discord -->
            <div class="panel" style="padding: 20px;">
                <div class="section-title">
                    <i class="fa-brands fa-discord"></i> ສົ່ງລາຍງານເຂົ້າ Discord
                </div>
                <div class="form-group">
                    <label>Discord Webhook URL</label>
                    <input type="text" id="discordWebhookInput" placeholder="https://discord.com/api/webhooks/...">
                </div>
                <!-- ปุ่มบันทึก URL -->
                <button class="btn-primary btn-save-webhook" onclick="saveWebhookUrl()">
                    <i class="fa-solid fa-floppy-disk"></i> ບັນທຶກ URL ດິດສ໌ຄອດ
                </button>
                <!-- ปุ่มส่งข้อมูล -->
                <button class="btn-primary btn-discord" onclick="sendToDiscordImage()">
                    <i class="fa-solid fa-camera"></i> ສົ່ງຕາຕະລາງງານເປັນຮູບພາບ
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDateKey = null;
        
        // โหลดข้อมูลภารกิจและ Webhook จาก localStorage (ถ้ามี)
        let tasksData = JSON.parse(localStorage.getItem('syndicate_ops_tasks')) || {};
        let savedWebhook = localStorage.getItem('syndicate_webhook_url') || '';

        document.getElementById('discordWebhookInput').value = savedWebhook;

        // ฟังก์ชันกดปุ่มบันทึก URL ดิสคอร์ด
        function saveWebhookUrl() {
            const webhookUrl = document.getElementById('discordWebhookInput').value.trim();
            if (!webhookUrl) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ຊ່ອງว่างเปล่า',
                    text: 'ກະລຸນາຕື່ມລິ້ງ Discord Webhook ກ່ອນทำการບັນທຶກ!',
                    background: '#181d28',
                    color: '#fff',
                    confirmButtonColor: '#8b0000'
                });
                return;
            }

            localStorage.setItem('syndicate_webhook_url', webhookUrl);
            Swal.fire({
                icon: 'success',
                title: 'ບັນທຶກສຳເລັດ!',
                text: 'ระบบจดจำ URL ของ Discord เรียบร้อยแล้ว',
                background: '#181d28',
                color: '#fff',
                confirmButtonColor: '#8b0000',
                timer: 2000,
                showConfirmButton: false
            });
        }

        const monthNames = ["ມັງກອນ", "ກຸມພາ", "ມີນາ", "ເມສາ", "ພຶດສະພາ", "ມິຖຸນາ", "ກໍລະກົດ", "ສິງຫາ", "ກັນຍາ", "ຕຸລາ", "ພະຈິກ", "ທັນວາ"];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarTitle').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

            const matrix = document.getElementById('daysMatrix');
            matrix.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                matrix.appendChild(emptyCell);
            }

            const todayObj = new Date();

            for (let day = 1; day <= totalDaysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day';

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateKey = `${year}-${formattedMonth}-${formattedDay}`;

                if (day === todayObj.getDate() && month === todayObj.getMonth() && year === todayObj.getFullYear()) {
                    cell.classList.add('today');
                }

                if (selectedDateKey === dateKey) {
                    cell.classList.add('selected');
                }

                let pillsHtml = '';
                if (tasksData[dateKey] && tasksData[dateKey].length > 0) {
                    tasksData[dateKey].forEach(t => {
                        pillsHtml += `<div class="task-pill" title="${t}">${t}</div>`;
                    });
                }

                cell.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="task-pills-container">${pillsHtml}</div>
                `;

                cell.onclick = () => selectDate(dateKey, day, monthNames[month], year);
                matrix.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function resetToCurrentMonth() {
            currentDate = new Date();
            renderCalendar();
        }

        function selectDate(dateKey, day, monthName, year) {
            selectedDateKey = dateKey;
            document.getElementById('activeDateLabel').innerHTML = `📌 ກຳລັງເລືອກ: <b>${day} ${monthName} ${year}</b>`;
            renderCalendar();
            renderTaskManagementList();
        }

        function addNewTask() {
            if (!selectedDateKey) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ຍັງບໍ່ໄດ້ເລືອກວັນທີ',
                    text: 'ກະລຸນາຄລິກເລືອກວັນທີເທິງປະຕິທິນກ່ອນບັນທຶກພາລະກິດ!',
                    background: '#181d28',
                    color: '#fff',
                    confirmButtonColor: '#8b0000'
                });
                return;
            }

            const input = document.getElementById('taskInput');
            const val = input.value.trim();
            if (!val) return;

            if (!tasksData[selectedDateKey]) {
                tasksData[selectedDateKey] = [];
            }

            tasksData[selectedDateKey].push(val);
            localStorage.setItem('syndicate_ops_tasks', JSON.stringify(tasksData));

            input.value = '';
            renderCalendar();
            renderTaskManagementList();
        }

        function renderTaskManagementList() {
            const container = document.getElementById('taskManagementList');
            container.innerHTML = '';

            if (!selectedDateKey || !tasksData[selectedDateKey] || tasksData[selectedDateKey].length === 0) {
                container.innerHTML = `<div class="empty-task-notice">ບໍ່ມີພາລະກິດໃນວັນນີ້</div>`;
                return;
            }

            tasksData[selectedDateKey].forEach((task, idx) => {
                const item = document.createElement('div');
                item.className = 'task-manage-item';
                item.innerHTML = `
                    <span>• ${task}</span>
                    <button class="btn-delete" onclick="deleteTask('${selectedDateKey}', ${idx})" title="ລຶບວຽກນີ້"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(item);
            });
        }

        function deleteTask(dateKey, index) {
            tasksData[dateKey].splice(index, 1);
            if (tasksData[dateKey].length === 0) {
                delete tasksData[dateKey];
            }
            localStorage.setItem('syndicate_ops_tasks', JSON.stringify(tasksData));
            renderCalendar();
            renderTaskManagementList();
        }

        // ฟังก์ชันแปลงปฏิทินเป็นรูปภาพและส่งเข้า Discord Webhook (ปรับปรุงความเร็ว)
        async function sendToDiscordImage() {
            const webhookUrl = document.getElementById('discordWebhookInput').value.trim();
            if (!webhookUrl) {
                Swal.fire({
                    icon: 'error',
                    title: 'ບໍ່ພົບ Webhook URL',
                    text: 'ກະລຸນາຕື່ມ ແລະ ບັນທຶກລິ້ງ Discord Webhook ໃຫ້ຮຽບຮ້ອຍກ່ອນສົ່ງ',
                    background: '#181d28',
                    color: '#fff',
                    confirmButtonColor: '#8b0000'
                });
                return;
            }

            Swal.fire({
                title: 'ກຳລັງສົ່ງຂໍ້ມູນ...',
                text: 'ກຳລັງປະມວນຜົນ ແລະ ສົ່ງຮູບພາບເຂົ້າ Discord',
                background: '#181d28',
                color: '#fff',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const captureElement = document.getElementById('captureArea');
                
                // ปรับ scale เป็น 1 และเปิดใช้ useCORS เพื่อให้เรนเดอร์ภาพได้รวดเร็วทันใจ ไม่ค้าง
                const canvas = await html2canvas(captureElement, {
                    backgroundColor: '#11141b',
                    scale: 1, 
                    useCORS: true,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'syndicate-schedule.png');
                    formData.append('content', '📋 **ຂຽນລົງແລ້ວກະເຊີນໃຫ້ມືງເຮັດຕາມແນ່**');

                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok || response.status === 204) {
                        Swal.fire({
                            icon: 'success',
                            title: 'ສົ່ງຮູບສຳເລັດ!',
                            text: 'ຕາຕະລາງງານຖືກສົ່ງເຂົ້າ Discord ຮຽບຮ້ອຍແລ້ວ',
                            background: '#181d28',
                            color: '#fff',
                            confirmButtonColor: '#8b0000',
                            timer: 2000,
                            showConfirmButton: false
                        });
                    } else {
                        throw new Error('Discord rejected request');
                    }
                }, 'image/png');

            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'ເກີດຂໍ້ຜິດພາດ',
                    text: 'ບໍ່ສາມາດສົ່ງຮູບພາບໄປຍັງ Discord ได้ ກະລຸນາຕວດສອບ Webhook URL อีกครั้ง',
                    background: '#181d28',
                    color: '#fff',
                    confirmButtonColor: '#8b0000'
                });
            }
        }

        renderCalendar();
    </script>
</body>
</html>
